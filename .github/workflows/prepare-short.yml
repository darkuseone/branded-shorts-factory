name: Prepare Short

# Phase 1 of the two-phase pipeline.
# Push a scenario JSON → synthesise voice + word timings + search/QA.
# Download the artifact, feed voice.mp3 into HeyGen MCP in chat, commit
# jobs/<id>/avatar.mp4, then the Render Short workflow finishes the MP4.
# Manual only. This runs a full voice + search + QA pass — tens of minutes and
# real ElevenLabs and stock calls — and it exists to produce the material for a
# HeyGen avatar that does not exist yet. Firing it on every scenario edit spent
# that on scenarios whose avatar was already committed, and raced Render Short
# for the same job.
on:
  workflow_dispatch:
    inputs:
      spec:
        description: "Path to the scenario JSON"
        required: true
        default: "examples/venus-hell.json"

concurrency:
  group: prepare-short-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      MAGNIFIC_API_KEY: ${{ secrets.MAGNIFIC_API_KEY }}
      GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      POND5_API_KEY: ${{ secrets.POND5_API_KEY }}
      MAGNIFIC_TOKEN_BUDGET: ${{ vars.MAGNIFIC_TOKEN_BUDGET || '40' }}
      MAGNIFIC_TOKEN_RESERVE: ${{ vars.MAGNIFIC_TOKEN_RESERVE || '10' }}
      PYTHONPATH: src

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pick the scenario
        id: pick
        run: |
          python3 scripts/pick_scenario.py \
            --spec "${{ inputs.spec }}" \
            --before "${{ github.event.before }}" \
            --sha "${{ github.sha }}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Validate
        run: python -m shorts_factory validate "${{ steps.pick.outputs.spec }}"

      - name: Prepare (voice + visuals, no avatar)
        run: python -m shorts_factory prepare "${{ steps.pick.outputs.spec }}"

      - name: Summary
        if: always()
        run: |
          PREPARE="build/prepare/${{ steps.pick.outputs.id }}"
          REPORT="build/reports/${{ steps.pick.outputs.id }}.json"
          {
            echo "## prepare ${{ steps.pick.outputs.id }}"
            echo "- artifact dir: \`$PREPARE\`"
            if [ -f "$PREPARE/words.json" ]; then
              echo "- words.json: present"
            fi
            if [ -f "$PREPARE/voice.mp3" ]; then
              echo "- voice.mp3: present — download this and feed it to HeyGen MCP"
            fi
            if [ -f "$REPORT" ]; then
              python3 - "$REPORT" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1]))
          qa = report["qa"]["counts"]
          print(f"- QA: **{qa['accepted']} accepted**, {qa['manual_review']} to review, "
                f"{qa['rejected']} unfilled")
          look = (report.get("voice") or {}).get("avatar")
          print(f"- Next: commit \`jobs/{report['spec_id']}/avatar.mp4\` after HeyGen, then push")
          PY
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload prepare artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prepare-${{ steps.pick.outputs.id }}
          path: |
            build/prepare/${{ steps.pick.outputs.id }}/**
            build/reports/${{ steps.pick.outputs.id }}.json
          if-no-files-found: warn
          retention-days: 14
