name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # This is a media pipeline: half the code paths under test probe, remux
      # or re-encode a clip. Without ffmpeg those paths silently take their
      # degraded branch and CI calls the result green.
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install dependencies
        run: python -m pip install --upgrade pip pytest ruff pydantic PyYAML

      - name: Lint
        run: ruff check src tests

      - name: Format check
        run: ruff format --check src tests

      - name: Tests
        run: python -m pytest

      # The example scenario is the contract for every hand-authored JSON;
      # if it stops validating cleanly, the docs are lying.
      - name: Validate the example scenario
        env:
          PYTHONPATH: src
        run: python -m shorts_factory validate examples/venus-hell.json

      # The rhythm rules are measured from the reference videos; a shotlist
      # that breaks them is an editorial defect, so CI gates on it.
      - name: Check the rhythm engine end to end
        run: make shotlist
