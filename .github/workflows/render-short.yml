name: Render Short

# Phase 3 of the two-phase pipeline.
# Triggers when a committed avatar clip lands under jobs/<id>/avatar.*.
# Uses the external avatar path — no HEYGEN_API_KEY required.
on:
  push:
    paths:
      - "jobs/**/avatar.mp4"
      - "jobs/**/avatar.webm"
      - "jobs/**/broll/**"
      - "jobs/*.json"
  workflow_dispatch:
    inputs:
      spec:
        description: "Path to the scenario JSON"
        required: true
        default: "examples/venus-hell.json"
      dry_run:
        description: "Stop before rendering"
        type: boolean
        default: false
      docker:
        description: "Render inside Docker"
        type: boolean
        default: true

concurrency:
  group: render-short-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    # A 25-shot Short with live search genuinely needs about an hour: the last
    # measured run spent ~48 min filling slots and 11 min in HyperFrames. At 90
    # the job was killed mid-render — and a killed job runs no cleanup, so
    # there was no artifact, no report and no diagnosis, only a log that stops.
    timeout-minutes: 150

    env:
      # HeyGen is intentionally omitted — avatar comes from jobs/<id>/avatar.*
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY || secrets.ELEVEN_API_KEY }}
      MAGNIFIC_API_KEY: ${{ secrets.MAGNIFIC_API_KEY }}
      # xAI publishes this key as XAI_API_KEY, and the code accepts either
      # spelling. The workflow forwarded only one, so a key stored under the
      # other name reached the process empty and the vision gate silently
      # never ran.
      GROK_API_KEY: ${{ secrets.GROK_API_KEY || secrets.XAI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      POND5_API_KEY: ${{ secrets.POND5_API_KEY }}
      MAGNIFIC_TOKEN_BUDGET: ${{ vars.MAGNIFIC_TOKEN_BUDGET || '40' }}
      MAGNIFIC_TOKEN_RESERVE: ${{ vars.MAGNIFIC_TOKEN_RESERVE || '10' }}
      # Push events have empty inputs — always Docker-render unless explicitly disabled.
      HYPERFRAMES_SKIP_CHECK: "1"
      # The pipeline's own budget stops it reaching for slow optional tiers in
      # time to still finish, well inside the step cap below.
      RUN_WALLCLOCK_MINUTES: ${{ vars.RUN_WALLCLOCK_MINUTES || '55' }}
      HYPERFRAMES_DOCKER: ${{ github.event_name == 'workflow_dispatch' && inputs.docker == false && '0' || '1' }}
      PYTHONPATH: src

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Pick the scenario
        id: pick
        run: |
          python3 scripts/pick_scenario.py \
            --spec "${{ inputs.spec }}" \
            --before "${{ github.event.before }}" \
            --sha "${{ github.sha }}" \
            --require-avatar

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      # Infographic cards are HTML screenshotted by Playwright. Without this
      # the card silently fails to render and the slot falls through to stock
      # search — which is how two of them ended up hunting Pexels for a chart.
      - name: Install Playwright and Chromium
        run: |
          python -m pip install --upgrade pip playwright
          python -m playwright install --with-deps chromium

      - name: Install HyperFrames skills
        run: npx --yes skills add heygen-com/hyperframes

      - name: Install chrome-headless-shell
        run: |
          npx --yes @puppeteer/browsers install chrome-headless-shell@stable
          BIN=$(find "$HOME/.cache/puppeteer" -type f -name 'chrome-headless-shell' 2>/dev/null | head -n 1)
          if [ -n "$BIN" ]; then
            echo "HYPERFRAMES_BROWSER_PATH=$BIN" >> "$GITHUB_ENV"
            echo "Using chrome-headless-shell at $BIN"
          else
            echo "::warning::chrome-headless-shell binary not found; HyperFrames will fall back to system Chrome"
          fi

      - name: Environment check
        run: python -m shorts_factory doctor

      - name: Validate
        run: python -m shorts_factory validate "${{ steps.pick.outputs.spec }}"

      # Capped below the job so a slow render fails this step instead of
      # killing the job. The difference matters: a failed step still runs the
      # summary, the artifact uploads and the explainer, so a timeout comes
      # with a diagnosis and whatever was produced. A killed job leaves
      # nothing at all.
      - name: Render (external avatar)
        id: build
        timeout-minutes: 115
        run: |
          set -o pipefail
          mkdir -p build
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="--dry-run"; fi
          python -m shorts_factory $ARGS render "${{ steps.pick.outputs.spec }}" 2>&1 | tee build/render.log

      - name: Verify output (catch dead b-roll / missing host modes)
        if: success() && inputs.dry_run != true
        run: python3 scripts/verify_short.py "${{ steps.pick.outputs.spec }}"

      - name: Summary
        if: always()
        run: |
          REPORT="build/reports/${{ steps.pick.outputs.id }}.json"
          {
            echo "## render ${{ steps.pick.outputs.id }}"
            if [ -f "$REPORT" ]; then
              python3 - "$REPORT" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1]))
          qa = report["qa"]["counts"]
          print(f"- QA: **{qa['accepted']} accepted**, {qa['manual_review']} to review, "
                f"{qa['rejected']} unfilled ({qa['vision_checked']} vision-checked)")
          budget = report.get("budget") or {}
          print(f"- Magnific tokens: **{budget.get('spent', 0)}/{budget.get('total', 0)}**")
          print(f"- Output: `{report.get('output') or 'not produced'}`")
          avatar = (report.get("voice") or {}).get("avatar") or {}
          print(f"- Avatar source: **{avatar.get('source', '?')}**")
          for warning in report.get("warnings", [])[:15]:
              print(f"  - ⚠️ {warning}")
          PY
            else
              echo "No report was produced — check the render step log."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ steps.pick.outputs.id }}
          path: |
            build/output/*.mp4
            build/reports/*.json
          if-no-files-found: warn
          retention-days: 30

      - name: Upload the composition for debugging
        if: failure() || inputs.dry_run == true
        uses: actions/upload-artifact@v4
        with:
          name: composition-${{ steps.pick.outputs.id }}
          path: build/composition/**
          if-no-files-found: ignore
          retention-days: 7

      # Last on purpose. Two upload steps emit ~80 lines of boilerplate each,
      # so a failure explained before them is invisible to anything reading
      # the tail — which is every log reader there is.
      - name: Why it failed
        if: failure()
        run: python3 scripts/explain_failure.py "${{ steps.pick.outputs.id }}"
